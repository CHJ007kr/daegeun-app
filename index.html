<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대근 관리 앱</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .menu-card p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .icon {
      font-size: 28px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>대근 관리</h1>
      <p>정유1팀 대근 관리 시스템</p>
    </div>

    <div class="menu">

      <div class="menu-card" onclick="alert('대근 등록 화면은 다음 단계에서 만들 예정입니다.')">
        <div class="icon">🕐</div>
        <h2>대근 등록</h2>
        <p>휴가 및 대근 신청을 등록합니다.</p>
      </div>

      <div class="menu-card" onclick="alert('근무 달력 화면은 다음 단계에서 만들 예정입니다.')">
        <div class="icon">📅</div>
        <h2>근무 달력</h2>
        <p>주간 · 야간 · 휴무 · 대근 · 교육 일정을 확인합니다.</p>
      </div>

      <div class="menu-card" onclick="alert('개인 설정 화면은 다음 단계에서 만들 예정입니다.')">
        <div class="icon">⚙️</div>
        <h2>개인 설정</h2>
        <p>이름 · 교대조 · 근무지역 · 직책을 설정합니다.</p>
      </div>

    </div>

  </div>

</body>
</html>
